# Named so the stack is the same one whichever directory you run compose from.
# Without this the project name comes from the directory, and `docker compose exec`
# quietly reports "service not running" against a stack that is running fine.
#
# COMPOSE_PROJECT_NAME overrides this, and GMCP_PORT moves the site, so a second worktree
# can bring up its own stack rather than fighting this one over the same database. The
# admin suite is destructive, so two runs sharing a stack do not merely fail, they fail
# in ways that look like real regressions in both.
#
#   COMPOSE_PROJECT_NAME=wptest2 GMCP_PORT=8081 docker compose up -d
name: wptest

services:
  db:
    image: mariadb:11
    # Named, so `docker compose down` keeps the site. Without this the database sits in
    # an anonymous volume that down removes, and the next `up` greets you with "the site
    # you have requested is not installed" after you have spent an hour seeding it.
    volumes:
      - wpdb:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
  # The plugin directory must be named guarded-mcp. The plugin derives its own identity from
  # the folder through plugin_basename(), and the guard that stops an agent deactivating
  # or deleting itself mid-call compares against that, so under any other name the guard
  # silently stops matching.
  wp:
    image: wordpress:php8.2-apache
    depends_on:
      db: { condition: service_healthy }
    ports: ["${GMCP_PORT:-8080}:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DEBUG: 1
    volumes:
      - wpdata:/var/www/html
      - ..:/var/www/html/wp-content/plugins/guarded-mcp
  cli:
    image: wordpress:cli-php8.2
    user: "33:33"
    depends_on: [wp]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    volumes:
      - wpdata:/var/www/html
      - ..:/var/www/html/wp-content/plugins/guarded-mcp
    entrypoint: ["sleep", "infinity"]
volumes:
  wpdata:
  wpdb:
