name: Package

# Builds the installable zip on every push and pull request and checks its shape, so a
# change that would break the release (version drift, a wrong folder name, development
# files leaking into the package) is caught before a release PR is merged.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (resolved with git ls-remote against the release
      # tags noted beside each). Bump them deliberately; a moving tag in a job that can sign
      # and publish would let someone else's push change what this repository releases.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Version strings agree
        run: .dev/check-release.sh version

      - name: Build
        run: .dev/build.sh

      - name: Check the zip
        run: .dev/check-release.sh zip tmp/guarded-mcp-*.zip

      # archive: false uploads the plugin zip as-is. Without it the Actions UI wraps the
      # file in a second zip, and handing that outer zip to WordPress fails with "No valid
      # plugins were found" because the plugin folder sits one archive too deep. The
      # artifact is named after the file, so the name input is ignored.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: tmp/guarded-mcp-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
