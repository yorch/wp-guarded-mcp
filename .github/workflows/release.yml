name: Release

# Commit-driven releases. release-please reads the Conventional Commit messages that have
# landed on main since the last release and keeps one open "release PR" that bumps the
# version (guarded-mcp.php, readme.txt) and writes CHANGELOG.md. Merging that PR is the
# release: release-please then creates the tag and the GitHub Release, and the second job
# below builds the zip, checks it, attests it and attaches it.
#
# Pushing a tag by hand does not release anything any more.
#
# TOKEN. Pull requests, tags and releases created with the default GITHUB_TOKEN do not start
# other workflows. So the build is a job in this workflow rather than a tag-triggered one,
# and nothing here depends on that. What does depend on it is the release PR itself: with
# the default token, package.yml and plugin-check.yml do not run on it. To get those checks
# on the release PR, add a repository secret RELEASE_PLEASE_TOKEN (a fine-grained token or a
# GitHub App token with contents, pull-requests and issues write). Without it the workflow
# still works and falls back to GITHUB_TOKEN.

on:
  push:
    branches: [main]

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

# One at a time, and never cancel a release half way through.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tag and release
      pull-requests: write   # the release PR
      issues: write          # release-please labels the PR through the issues API
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Pinned to a commit SHA (resolved with git ls-remote; v5.0.0, whose only breaking
      # change is the node24 runtime). Bump deliberately: this action writes tags and
      # releases.
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Names a deployment environment so required reviewers can be put in front of the
    # upload (Settings, Environments). By this point the tag and the release exist, so it
    # gates the files, not the release. The control over what gets released is who may
    # merge the release PR into main.
    environment: release
    permissions:
      contents: write      # attach the files to the release
      id-token: write      # sign the attestation
      attestations: write  # store the attestation
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # Same pinning as above; bump deliberately.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          # All branches, so origin/main exists for the check below.
          fetch-depth: 0
          # Nothing after this step needs git credentials; do not leave the token in .git/config.
          persist-credentials: false

      - name: Tagged commit is on main
        run: |
          # If origin/main is missing, merge-base fails and this refuses, which is the safe direction.
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "Tag $TAG is not reachable from origin/main; refusing to attach files." >&2
            exit 1
          fi

      - name: Version strings agree with the tag
        run: .dev/check-release.sh version "$TAG"

      - name: Build
        run: .dev/build.sh

      - name: Check the zip
        run: .dev/check-release.sh zip tmp/guarded-mcp-*.zip

      - name: Prepare release files
        working-directory: tmp
        run: |
          VERSIONED=$(ls guarded-mcp-*.zip)
          [ "$(printf '%s\n' "$VERSIONED" | wc -l)" -eq 1 ] || { echo "expected exactly one zip" >&2; exit 1; }
          cp "$VERSIONED" guarded-mcp.zip
          sha256sum "$VERSIONED" > "$VERSIONED.sha256"
          sha256sum guarded-mcp.zip > guarded-mcp.zip.sha256
          sha256sum -c "$VERSIONED.sha256" guarded-mcp.zip.sha256
          ls -l

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            tmp/guarded-mcp-*.zip
            tmp/guarded-mcp.zip

      # The release already exists (release-please made it, with the changelog as its
      # notes), so this only adds files. No --clobber: if a file is already there, stop
      # and look rather than overwrite something users may have downloaded.
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            tmp/guarded-mcp-*.zip tmp/guarded-mcp-*.zip.sha256 \
            tmp/guarded-mcp.zip tmp/guarded-mcp.zip.sha256
