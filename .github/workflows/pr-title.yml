name: PR title

# Versions come from commit messages, so a mislabelled commit means a wrong release number:
# a "chore:" that is really a fix ships nothing, a "feat:" that is really a fix over-bumps.
# This repository squash-merges (the ruleset requires linear history), which makes the PR
# title the commit message that release-please reads. Rebase merges keep each commit's own
# message, which this check does not look at.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)(\([a-z0-9._/-]+\))?!?: .+'
          # Control: the pattern must accept a known-good title and refuse a known-bad one.
          [[ "fix(build): x" =~ $re ]] || { echo "internal: pattern rejects a valid title" >&2; exit 1; }
          [[ "Update stuff" =~ $re ]] && { echo "internal: pattern accepts an invalid title" >&2; exit 1; }
          if ! [[ "$TITLE" =~ $re ]]; then
            echo "PR title is not a Conventional Commit: $TITLE" >&2
            echo "Use type(scope): subject. feat bumps the minor version, fix the patch, ! or a BREAKING CHANGE footer the major." >&2
            exit 1
          fi
